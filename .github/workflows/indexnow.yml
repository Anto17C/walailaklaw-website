# After every push to main, wait for Cloudflare Pages to serve the new version,
# then notify Bing and other IndexNow engines of the pages that changed.
# The IndexNow key is the public token in /<key>.txt at the site root (not a secret).
name: IndexNow after deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      all:
        description: "Submit every sitemap URL"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  indexnow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Submit changed pages
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          SUBMIT_ALL: ${{ inputs.all }}
        run: |
          python3 - <<'PY'
          import os, re, json, time, subprocess, pathlib, urllib.request, urllib.error
          HOST = "walailaklaw.com"
          # Cloudflare rejects the default Python user agent, so identify the check.
          UA = "Mozilla/5.0 (compatible; WLF-IndexNow/1.0; +https://walailaklaw.com/)"
          root = pathlib.Path(".")
          key = next((f.stem for f in root.glob("*.txt")
                      if re.fullmatch(r"[0-9a-f]{32}", f.stem) and f.read_text().strip() == f.stem), None)
          if not key:
              raise SystemExit("No IndexNow key file at the site root.")
          sitemap = re.findall(r"<loc>([^<]+)</loc>", (root / "sitemap.xml").read_text())

          def url_for(path):
              p = path[:-5] if path.endswith(".html") else path
              p = "" if p == "index" else (p[:-5] if p.endswith("index") else p)
              return f"https://{HOST}/{p}"

          before, after = os.environ.get("BEFORE", ""), os.environ["AFTER"]
          new_in_sitemap = []   # URLs added to sitemap.xml by this push; the live sitemap must list them before we submit
          if os.environ.get("SUBMIT_ALL") == "true" or not before or set(before) == {"0"}:
              urls = sitemap
          else:
              changed = subprocess.run(["git", "diff", "--name-only", before, after],
                                       capture_output=True, text=True, check=True).stdout.split()
              urls = [u for u in (url_for(f) for f in changed if f.endswith(".html")) if u in sitemap]
              # A sitemap-only change (for example a newly activated language) has no changed HTML: also submit
              # the URLs that are new in the sitemap since the previous commit.
              if "sitemap.xml" in changed:
                  old_map = subprocess.run(["git", "show", f"{before}:sitemap.xml"], capture_output=True, text=True).stdout
                  old_urls = set(re.findall(r"<loc>([^<]+)</loc>", old_map))
                  new_in_sitemap = [u for u in sitemap if u not in old_urls]
                  urls += [u for u in new_in_sitemap if u not in urls]
          if not urls:
              print("No sitemap pages changed in this push; nothing to submit.")
              raise SystemExit(0)

          # Wait until Cloudflare serves the new version of one changed page (max ~12 minutes).
          # The edge rewrites email links, injects scripts and adds a hidden link after <body>,
          # so check that every repo line (except those the edge touches) is present live.
          SKIP = ("mailto:", "<body", "</body", "main.js", "</html", "email-protection")
          def lines(html):
              return [l.strip() for l in html.splitlines() if l.strip()]
          # Probe up to three changed pages (first, middle, last) so one lagging edge copy cannot pass for all.
          def probe_for(u):
              return next(f for f in subprocess.run(["git", "ls-files", "*.html"], capture_output=True,
                          text=True).stdout.split() if url_for(f) == u)
          samples = []
          for u in (urls[0], urls[len(urls) // 2], urls[-1]):
              if u not in samples:
                  samples.append(u)
          probes = [(u, [l for l in lines((root / probe_for(u)).read_text()) if not any(s in l for s in SKIP)])
                    for u in samples]
          def live_matches():
              try:
                  if new_in_sitemap:
                      sm_req = urllib.request.Request(f"https://{HOST}/sitemap.xml?indexnow={int(time.time())}", headers={"User-Agent": UA})
                      with urllib.request.urlopen(sm_req, timeout=20) as r:
                          live_sitemap = set(re.findall(r"<loc>([^<]+)</loc>", r.read().decode("utf-8", "replace")))
                      if not all(u in live_sitemap for u in new_in_sitemap):
                          return False
                  for u, local in probes:
                      probe_req = urllib.request.Request(u + f"?indexnow={int(time.time())}", headers={"User-Agent": UA})
                      with urllib.request.urlopen(probe_req, timeout=20) as r:
                          live = set(lines(r.read().decode("utf-8", "replace")))
                      if not all(l in live for l in local):
                          return False
                  return True
              except Exception:
                  return False
          for _ in range(48):
              if live_matches():
                  print("New version is live.")
                  break
              time.sleep(15)
          else:
              # Do not tell search engines about pages that are not served yet: fail the run so it shows red,
              # then re-run it from the Actions tab (workflow_dispatch) once the deploy has finished.
              raise SystemExit("Live site did not match within the wait; not submitting. Re-run this workflow after the deploy completes.")

          body = json.dumps({"host": HOST, "key": key, "keyLocation": f"https://{HOST}/{key}.txt",
                             "urlList": urls}).encode()
          req = urllib.request.Request("https://api.indexnow.org/indexnow", data=body,
                                       headers={"Content-Type": "application/json; charset=utf-8", "User-Agent": UA})
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  print(f"IndexNow: HTTP {r.status} for {len(urls)} URL(s)")
          except urllib.error.HTTPError as e:
              raise SystemExit(f"IndexNow: HTTP {e.code} {e.reason}")
          for u in urls:
              print(" ", u)
          PY
